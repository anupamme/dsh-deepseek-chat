<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>CHAT shell UI regression fixture — not DSH</title>
<style>
/* Official DSH 0.2.1-rc.3 ui-theme scrollbar contract, reproduced only for this fixture. */
body{--dsh-scrollbar-thumb:var(--dsw-alias-scrollbar-bg-l1);--dsh-scrollbar-thumb-hover:var(--dsw-alias-scrollbar-hover-l1);--dsh-scrollbar-thumb-border:0px;--dsh-scrollbar-track-margin:0px;--dsh-scrollbar-width:5px}
@supports not selector(::-webkit-scrollbar){body,body *{scrollbar-width:thin;scrollbar-color:var(--dsh-scrollbar-thumb) transparent}}
::-webkit-scrollbar{width:var(--dsh-scrollbar-width);height:var(--dsh-scrollbar-width)}
::-webkit-scrollbar-track{margin-block:var(--dsh-scrollbar-track-margin);background:transparent}
::-webkit-scrollbar-thumb{border:var(--dsh-scrollbar-thumb-border) solid transparent;background:var(--dsh-scrollbar-thumb);background-clip:content-box;border-radius:999px}
::-webkit-scrollbar-thumb:hover{background-color:var(--dsh-scrollbar-thumb-hover)}
::-webkit-scrollbar-corner{background:transparent}
body{font:14px/1.5 system-ui;margin:24px;background:#fff;color:#222;--dsw-alias-label-primary:#222;--dsw-alias-scrollbar-bg-l1:#cfd3d6;--dsw-alias-scrollbar-hover-l1:#adb2b8}
body[data-dark]{background:#171719;color:#eee;--dsw-alias-label-primary:#eee;--dsw-alias-scrollbar-bg-l1:#545557;--dsw-alias-scrollbar-hover-l1:#7f8287}
.comparison{display:flex;gap:24px}.box{width:260px;min-width:0}.sidebar-region{--dsh-sidebar-inline-padding:12px;height:200px;display:flex;flex-direction:column;overflow:hidden}
/* Actual rc.3 WorkspaceBrowser root/listArea/treeBody/list geometry, not a flat approximation. */
.harness-root{--dsh-session-list-edge-inset:var(--dsh-sidebar-inline-padding);--dsh-session-list-scrollbar-width:5px;--dsh-session-list-scrollbar-offset:2px;box-sizing:border-box;min-height:0;padding-right:var(--dsh-session-list-edge-inset);display:flex;flex-direction:column;flex:1}
.harness-list-area{min-height:0;margin-left:-4px;margin-right:calc(-1 * var(--dsh-session-list-edge-inset));padding-left:4px;display:flex;flex-direction:column;flex:1}
.harness-tree-body{min-height:0;display:flex;flex-direction:column;flex:1}
.harness-reference{box-sizing:border-box;min-height:0;margin-left:-4px;margin-right:var(--dsh-session-list-scrollbar-offset);padding-left:4px;padding-right:calc(var(--dsh-session-list-edge-inset) - var(--dsh-session-list-scrollbar-width) - var(--dsh-session-list-scrollbar-offset));padding-bottom:16px;scrollbar-gutter:stable;overflow-y:auto;flex:1}
.row{height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
[data-shortcut-modal="settings"]{display:flex;border:1px solid #aaa;border-radius:16px;margin-top:24px;width:600px;min-height:160px;padding:16px}
nav{width:170px}nav>div{display:flex;flex-direction:column;gap:4px}nav button{display:flex;align-items:center;gap:8px;border:0;border-radius:8px;background:transparent;padding:10px;color:inherit;font:inherit;text-align:left;cursor:pointer}nav button:hover{background:#8882}nav svg{width:16px;height:16px;flex:none}main{padding-left:24px}#results{white-space:pre-wrap}
</style></head><body>
<h2>虚构界面回归 / Fixture only — 未加载 DSH 或官网</h2>
<div class="comparison"><div class="box"><h3>HARNESS scrollbar contract</h3><div class="sidebar-region" id="reference-region"><div class="harness-root"><div class="harness-list-area"><div class="harness-tree-body"><div class="harness-reference" id="reference"></div></div></div></div></div></div><div class="box"><h3>CHAT actual stylesheet</h3><div class="sidebar-region" id="chat-region"><section class="dsh-chat-navigation"><div class="dsh-chat-navigation-list" id="chat-list"></div></section></div></div></div>
<pre id="results">Running…</pre><script type="module" src="/fixture.js"></script></body></html>
